<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Working</title>
  <link rel="stylesheet" href="./lib/base.css" />
  <style>
    html, body { background: transparent; }
    .pill { margin: 4px; height: 32px; display: inline-flex; align-items: center; gap: 9px; padding: 0 6px 0 12px; border-radius: 99px; background: #1c1b1a; color: #ecebe8; border: 1px solid rgba(255,255,255,.08); box-shadow: 0 6px 16px -6px rgba(0,0,0,.35); font-size: 12.5px; font-weight: 500; animation: pop .16s var(--ease); }
    .pill kbd { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.14); box-shadow: none; color: #c9cdd4; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.5); opacity: .5; } }
  </style>
</head>
<body>
  <div class="pill"><span class="dot"></span><span id="label">Working…</span><kbd>Esc</kbd></div>
  <script type="module">
    import { boot, listen, $ } from './lib/core.js';
    await boot();
    listen('typing-label', (e) => ($('#label').textContent = e.payload));
  </script>
</body>
</html>
