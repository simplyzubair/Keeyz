<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Columns</title>
  <link rel="stylesheet" href="./lib/base.css" />
  <style>
    html, body { background: transparent; overflow: hidden; }
    .card { margin: 6px; padding: 12px 10px 10px; border-radius: 16px; background: var(--bg); border: 1px solid var(--line-2); box-shadow: var(--shadow-lg); animation: pop .16s var(--ease); }
    .head { display: flex; align-items: baseline; gap: 6px; padding: 0 6px 8px; }
    .head b { font-size: 13.5px; letter-spacing: -.01em; }
    .head span { font-size: 11.5px; color: var(--text-3); }
    .row { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 10px; border-radius: 10px; cursor: pointer; }
    .row:hover { background: var(--bg-hover); }
    .row.on { background: var(--bg-active); }
    .n { width: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-2); }
    .row.on .n { color: var(--text); }
    /* a tiny screen split into n columns */
    .screen { flex: 1; height: 22px; display: flex; gap: 2px; padding: 2px; border-radius: 5px; border: 1px solid var(--line-2); }
    .screen i { flex: 1; border-radius: 2px; background: var(--bg-3); }
    .row.on .screen { border-color: var(--ink); }
    .row.on .screen i { background: var(--ink); opacity: .35; }
    .row.on .screen i:first-child { opacity: 1; }
    .foot { display: flex; justify-content: center; gap: 10px; padding-top: 8px; font-size: 11px; color: var(--text-3); }
  </style>
</head>
<body>
  <div class="card">
    <div class="head"><img src="./lib/logo.svg" alt="" style="width:16px;height:16px;border-radius:4px;align-self:center" /><b>Columns</b><span>then a number key puts a window in that column</span></div>
    <div id="rows"></div>
    <div class="foot"><span><kbd>↑</kbd><kbd>↓</kbd> choose</span><span><kbd>↵</kbd> pick</span><span><kbd>Esc</kbd> cancel</span></div>
  </div>
  <script type="module">
    import { boot, invoke, listen, win, $, $$ } from './lib/core.js';
    await boot();
    let val = 4, done = false;
    $('#rows').innerHTML = [2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<div class="row" data-n="${n}"><span class="n">${n}</span><span class="screen">${'<i></i>'.repeat(n)}</span></div>`).join('');
    const mark = () => $$('.row').forEach((r) => r.classList.toggle('on', +r.dataset.n === val));
    const pick = (n) => { if (done) return; done = true; invoke('snap_pick', { cols: n }); };
    const cancel = () => { if (done) return; done = true; invoke('snap_pick', { cols: null }); };
    listen('snap-picker', (e) => { val = e.payload || 4; done = false; mark(); });
    mark();
    $$('.row').forEach((r) => { r.onclick = () => pick(+r.dataset.n); r.onmousemove = () => { val = +r.dataset.n; mark(); }; });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') { e.preventDefault(); val = Math.max(2, val - 1); mark(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); val = Math.min(9, val + 1); mark(); }
      else if (e.key === 'Enter') { e.preventDefault(); pick(val); }
      else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
      else if (/^[2-9]$/.test(e.key)) { e.preventDefault(); pick(+e.key); }
    });
    // clicking somewhere else cancels
    win.onFocusChanged(({ payload: focused }) => { if (!focused) cancel(); });
  </script>
</body>
</html>
